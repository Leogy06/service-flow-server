name: Backend quality
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci_placeholder@127.0.0.1:3306/ci_generation_only
      REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: synthetic-ci-access-key-not-a-production-secret
      JWT_REFRESH_SECRET: synthetic-ci-refresh-key-not-a-production-secret
      RESEND_API_KEY: synthetic-ci-email-key
      EMAIL_FROM: CI <ci@example.invalid>
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx --no-install tsc --noEmit --incremental false
      - run: npm test -- --runInBand
      - run: npm run test:config:prisma
      - run: npm run test:config:launcher
      - run: npm run prod:build
      - run: npm run test:vercel:runtime
      - run: npm audit --audit-level=high
